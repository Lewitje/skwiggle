[package]
name = "skwiggle"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.1"

# Optimise dev builds: deps fully (compiled once), our code lightly (fast rebuilds).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
